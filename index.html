<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#070809" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="News Wall" />
<link rel="manifest" href="./manifest.webmanifest" />
<title>News Wall — Mobile UI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500;600;700&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#070809; --bg-1:#0d1014; --bg-2:#141922; --bg-3:#1b212c;
    --ink:#eef2f6; --ink-dim:#9aa7b4; --ink-dimmer:#566472;
    --line:#1b222c; --line-bright:#2b3441;
    --c-world:#f5b524; --c-canada:#ef5350; --c-local:#46a6ff; --c-tech:#ff7a47;
    --c-biz:#4db8a8; --c-ai:#c77dff; --c-pin:#52d6a0; --c-sports:#3ee089;
    --c-ringer:#ff7eb3; --c-ent:#f72585; --c-games:#9ea0ff; --c-review:#ffd24a; --c-hbr:#4db8a8;
    --c-markets:#b692ff; --c-weather:#39d0d8; --c-live:#ff4d4d; --c-fav:#ffd24a;
    --accent:var(--c-world);            /* live-themed to the active topic */
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; margin:0;}
  body{
    background:
      radial-gradient(900px 500px at 80% -10%, #0f2228 0%, transparent 55%),
      radial-gradient(800px 500px at 0% 120%, #141026 0%, transparent 55%),
      #04050a;
    font-family:'Archivo',system-ui,sans-serif;
    color:var(--ink);
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; padding:22px;
    -webkit-font-smoothing:antialiased;
  }

  /* ── phone shell ── */
  .device{
    width:392px; height:812px; max-height:calc(100vh - 30px);
    border-radius:46px; background:#000; padding:11px;
    box-shadow:0 0 0 2px #20242c, 0 30px 80px rgba(0,0,0,.7), inset 0 0 0 1px #333;
    position:relative; flex-shrink:0;
  }
  .screen{
    position:relative; width:100%; height:100%; border-radius:36px; overflow:hidden;
    background:var(--bg-0); display:flex; flex-direction:column;
  }
  /* scanline + notch */
  .screen::after{
    content:''; position:absolute; inset:0; pointer-events:none; z-index:60;
    background:repeating-linear-gradient(0deg, rgba(255,255,255,.012) 0px, rgba(255,255,255,.012) 1px, transparent 1px, transparent 3px);
    mix-blend-mode:overlay;
  }
  .notch{position:absolute; top:0; left:50%; transform:translateX(-50%); width:150px; height:26px; background:#000; border-radius:0 0 18px 18px; z-index:55;}
  .statusbar{height:38px; flex-shrink:0; display:flex; align-items:flex-end; justify-content:space-between; padding:0 22px 4px; font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink-dim); letter-spacing:.04em; z-index:50;}
  .statusbar .sig{display:flex; gap:4px; align-items:center;}
  .statusbar .sig span{display:inline-block; width:3px; background:var(--ink-dim); border-radius:1px;}

  /* ── HEADER ── */
  header{
    flex-shrink:0; padding:6px 14px 8px; display:flex; align-items:center; gap:10px;
    border-bottom:1px solid var(--line); background:linear-gradient(180deg,var(--bg-1),rgba(13,16,20,.6));
    position:relative; z-index:40;
  }
  .brand{display:flex; align-items:center; gap:8px; margin-right:auto;}
  .brand .mark{font-family:'Bebas Neue',sans-serif; font-size:25px; letter-spacing:.12em; line-height:1; color:var(--ink);}
  .onair{display:inline-flex; align-items:center; gap:5px; font-family:'IBM Plex Mono',monospace; font-size:9px; letter-spacing:.16em; color:var(--c-live); border:1px solid rgba(255,77,77,.4); border-radius:3px; padding:2px 5px;}
  .onair .dot{width:6px; height:6px; border-radius:50%; background:var(--c-live); box-shadow:0 0 7px var(--c-live); animation:pulse 1.6s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

  .chip{display:flex; align-items:center; gap:6px; cursor:pointer; padding:5px 9px; border:1px solid var(--line-bright); border-radius:8px; background:var(--bg-2); transition:border-color .14s, background .14s;}
  .chip:active{background:var(--bg-3);}
  .wx-mini .ic{width:22px; height:22px;}
  .wx-mini .t{font-family:'Bebas Neue',sans-serif; font-size:21px; line-height:1; color:var(--ink);}
  .wx-mini:active{border-color:var(--c-weather);}
  .loc .code{font-family:'IBM Plex Mono',monospace; font-size:13px; font-weight:600; color:var(--c-local); letter-spacing:.06em;}
  .loc svg{width:13px; height:13px; color:var(--c-local);}
  .gear{cursor:pointer; padding:5px; color:var(--ink-dim);}
  .gear svg{width:20px; height:20px; display:block;}
  .gear:active{color:var(--ink);}

  /* ── TOPIC STRIP ── */
  .strip-wrap{flex-shrink:0; position:relative; border-bottom:1px solid var(--line); background:var(--bg-0); z-index:35;}
  .strip{display:flex; gap:2px; overflow-x:auto; scrollbar-width:none; padding:0 8px; scroll-behavior:smooth;}
  .strip::-webkit-scrollbar{display:none;}
  .tab{position:relative; flex-shrink:0; cursor:pointer; padding:11px 13px 12px; font-family:'IBM Plex Mono',monospace; font-size:13px; font-weight:500; letter-spacing:.04em; color:var(--ink-dimmer); white-space:nowrap; transition:color .15s;}
  .tab.active{color:var(--accent);}
  .tab .ul{position:absolute; left:11px; right:11px; bottom:0; height:2.5px; border-radius:2px; background:var(--accent); transform:scaleX(0); transform-origin:center; transition:transform .2s ease;}
  .tab.active .ul{transform:scaleX(1);}
  .strip-fade{position:absolute; top:0; bottom:0; width:26px; pointer-events:none; z-index:2;}
  .strip-fade.l{left:0; background:linear-gradient(90deg,var(--bg-0),transparent);}
  .strip-fade.r{right:0; background:linear-gradient(270deg,var(--bg-0),transparent);}

  /* ── MAIN / PAGED TRACK ── */
  .viewport{flex:1; min-height:0; overflow:hidden; position:relative;}
  .track{display:flex; height:100%; will-change:transform;}
  .pane{flex:0 0 100%; height:100%; overflow-y:auto; overflow-x:hidden; scrollbar-width:none; -webkit-overflow-scrolling:touch;}
  .pane::-webkit-scrollbar{display:none;}
  .pane-inner{padding:2px 0 14px;}

  /* story card */
  .story{display:flex; flex-direction:column; gap:5px; padding:11px 15px; border-bottom:1px solid var(--line); position:relative; cursor:pointer; transition:background .12s;}
  .story:active{background:rgba(255,255,255,.03);}
  .story::before{content:''; position:absolute; left:0; top:10px; bottom:10px; width:2.5px; border-radius:2px; background:var(--accent); opacity:0; transition:opacity .15s;}
  .story.read{opacity:.5;}
  .story.read .s-head{color:var(--ink-dim); font-weight:400;}
  .story.read::before{opacity:.5;}
  .s-top{display:flex; align-items:center; gap:7px;}
  .s-tag{font-family:'IBM Plex Mono',monospace; font-size:10px; font-weight:600; letter-spacing:.07em; padding:2px 7px; border-radius:3px; text-transform:uppercase; flex-shrink:0;}
  .src-pill{font-family:'IBM Plex Mono',monospace; font-size:9.5px; letter-spacing:.04em; color:var(--ink-dim); background:var(--bg-2); border:1px solid var(--line-bright); border-radius:3px; padding:1px 5px;}
  .pop{font-family:'IBM Plex Mono',monospace; font-size:10px; font-weight:700; padding:1px 5px; border-radius:3px; white-space:nowrap;}
  .pop2{color:#ffb74d; background:rgba(255,167,77,.12);}
  .pop3{color:#ff9233; background:rgba(255,146,51,.15);}
  .pop4{color:#ff6a4d; background:rgba(255,106,77,.18);}
  .pop5{color:#ff4d4d; background:rgba(255,77,77,.22);}
  .s-meta{margin-left:auto; font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-dimmer); flex-shrink:0;}
  .s-head{font-family:'Archivo',sans-serif; font-size:15.5px; line-height:1.28; color:var(--ink); font-weight:500;}
  .tomato{font-family:'IBM Plex Mono',monospace; font-size:10px; font-weight:600; padding:1px 6px; border-radius:3px;}
  .tomato.fresh{background:rgba(250,50,10,.16); color:#ff6a4d;} .tomato.rotten{background:rgba(95,194,62,.16); color:#7bd45a;}
  .review-accent::before{background:var(--c-review); opacity:.85;}

  /* markets cards */
  .mk-group{padding:14px 15px 4px; font-family:'Bebas Neue',sans-serif; font-size:18px; letter-spacing:.1em; color:var(--c-markets);}
  .mk-row{display:flex; align-items:center; gap:12px; padding:10px 15px; border-bottom:1px solid var(--line);}
  .mk-sym{font-family:'IBM Plex Mono',monospace; font-size:14px; font-weight:600; color:var(--ink);}
  .mk-name{font-family:'Archivo',sans-serif; font-size:12px; color:var(--ink-dimmer);}
  .mk-price{margin-left:auto; font-family:'IBM Plex Mono',monospace; font-size:15px; font-weight:600; color:var(--ink); text-align:right;}
  .mk-chg{font-family:'IBM Plex Mono',monospace; font-size:12px; font-weight:600; min-width:64px; text-align:right;}
  .up{color:var(--c-sports);} .down{color:var(--c-live);}
  .mk-rate-v{font-family:'Bebas Neue',sans-serif; font-size:26px; letter-spacing:.02em; line-height:1; margin-left:auto; color:var(--ink);}

  /* scores */
  .sc-datebar{display:flex; gap:6px; padding:11px 15px 6px;}
  .sc-date{flex:1; text-align:center; cursor:pointer; font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.05em; padding:7px 0; border:1px solid var(--line-bright); border-radius:7px; color:var(--ink-dim); background:var(--bg-1);}
  .sc-date.active{color:var(--c-sports); border-color:var(--c-sports); background:rgba(62,224,137,.08);}
  .sc-lg{padding:13px 15px 5px; font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.1em; color:var(--ink-dimmer);}
  .sc-lg.live{color:var(--c-live);}
  .game{display:flex; flex-direction:column; gap:6px; margin:0 15px 9px; padding:11px 13px; background:var(--bg-1); border:1px solid var(--line); border-radius:9px;}
  .game.live{border-color:rgba(255,77,77,.4); box-shadow:inset 0 0 0 1px rgba(255,77,77,.1);}
  .game.fav{border-left:3px solid var(--c-fav);}
  .g-row{display:flex; align-items:center; gap:9px;}
  .g-abv{font-family:'IBM Plex Mono',monospace; font-size:14px; color:var(--ink-dim);}
  .g-sc{margin-left:auto; font-family:'IBM Plex Mono',monospace; font-size:17px; font-weight:600; color:var(--ink);}
  .g-sc.win{color:var(--c-sports);}
  .g-status{font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--ink-dimmer); letter-spacing:.03em; padding-top:5px; border-top:1px solid var(--line);}
  .game.live .g-status{color:var(--c-live);}
  .star{color:var(--c-fav); font-size:12px;}

  .empty{padding:40px 20px; text-align:center; color:var(--ink-dimmer); font-family:'IBM Plex Mono',monospace; font-size:12px;}

  /* ── BOTTOM NAV ── */
  nav{flex-shrink:0; display:flex; border-top:1px solid var(--line); background:linear-gradient(0deg,var(--bg-1),rgba(13,16,20,.65)); padding-bottom:14px; z-index:40;}
  .nav-btn{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:9px 0 5px; cursor:pointer; color:var(--ink-dimmer); transition:color .15s;}
  .nav-btn svg{width:22px; height:22px;}
  .nav-btn .lbl{font-family:'IBM Plex Mono',monospace; font-size:9.5px; letter-spacing:.08em;}
  .nav-btn.active{color:var(--nav-accent);}

  /* ── SHEETS / OVERLAYS ── */
  .scrim{position:absolute; inset:0; background:rgba(0,0,0,.55); opacity:0; pointer-events:none; transition:opacity .22s; z-index:70;}
  .scrim.open{opacity:1; pointer-events:auto;}
  .sheet{position:absolute; left:0; right:0; bottom:0; background:linear-gradient(180deg,var(--bg-1),var(--bg-0)); border-top:1px solid var(--line-bright); border-radius:20px 20px 0 0; transform:translateY(100%); transition:transform .28s cubic-bezier(.3,.9,.4,1); z-index:75; max-height:78%; overflow-y:auto; scrollbar-width:none; padding-bottom:24px;}
  .sheet::-webkit-scrollbar{display:none;}
  .sheet.open{transform:translateY(0);}
  .sheet-grip{width:40px; height:4px; border-radius:2px; background:var(--line-bright); margin:10px auto 4px;}
  .sheet-head{display:flex; align-items:center; justify-content:space-between; padding:8px 18px 12px;}
  .sheet-title{font-family:'Bebas Neue',sans-serif; font-size:23px; letter-spacing:.1em;}
  .sheet-x{font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink-dim); cursor:pointer; padding:4px 8px;}

  /* weather sheet */
  .wx-current{display:flex; align-items:center; gap:16px; padding:4px 18px 16px; border-bottom:1px solid var(--line);}
  .wx-big{width:64px; height:64px;}
  .wx-temp{font-family:'Bebas Neue',sans-serif; font-size:58px; line-height:.85; color:var(--ink);}
  .wx-cond{font-family:'Bebas Neue',sans-serif; font-size:15px; letter-spacing:.14em; color:var(--c-weather);}
  .wx-feels{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-dim); margin-top:3px;}
  .wx-hourly{display:flex; gap:4px; overflow-x:auto; scrollbar-width:none; padding:14px 14px 16px; border-bottom:1px solid var(--line);}
  .wx-hourly::-webkit-scrollbar{display:none;}
  .wx-hr{flex-shrink:0; width:54px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:5px;}
  .wx-hr .h{font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--ink-dimmer);}
  .wx-hr .ic{width:26px; height:26px;}
  .wx-hr .tp{font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--ink);}
  .wx-hr .pp{font-family:'IBM Plex Mono',monospace; font-size:9px; color:var(--c-local);}
  .wx-daily{padding:6px 18px 4px;}
  .wx-day{display:flex; align-items:center; gap:12px; padding:9px 0; border-bottom:1px solid var(--line);}
  .wx-day:last-child{border-bottom:none;}
  .wx-day .dn{font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--ink-dim); width:42px;}
  .wx-day .di{width:24px; height:24px;}
  .wx-day .dr{margin-left:auto; font-family:'IBM Plex Mono',monospace; font-size:13px;}
  .wx-day .dmax{color:var(--ink);} .wx-day .dmin{color:var(--ink-dimmer);}

  /* location sheet */
  .loc-opt{display:flex; align-items:center; gap:12px; padding:13px 18px; cursor:pointer; border-bottom:1px solid var(--line); transition:background .12s;}
  .loc-opt:active{background:var(--bg-2);}
  .loc-opt.sel{background:rgba(70,166,255,.08);}
  .loc-opt .lcode{font-family:'IBM Plex Mono',monospace; font-size:13px; font-weight:600; color:var(--c-local); width:38px;}
  .loc-opt.sel .lcode{color:var(--c-local);}
  .loc-opt .lcity{font-family:'Archivo',sans-serif; font-size:15px; color:var(--ink);}
  .loc-opt .lcheck{margin-left:auto; color:var(--c-local); font-size:14px; opacity:0;}
  .loc-opt.sel .lcheck{opacity:1;}
  .loc-detect{margin:12px 18px; padding:11px; text-align:center; border:1px solid var(--line-bright); border-radius:9px; background:var(--bg-2); color:var(--c-local); font-family:'IBM Plex Mono',monospace; font-size:12px; cursor:pointer;}

  /* ── PIN BAR (contextual: between strip and feed) ── */
  .pinbar-wrap{flex-shrink:0; border-bottom:1px solid var(--line); background:var(--bg-1); display:none; z-index:34;}
  .pinbar-wrap.show{display:block; animation:pinIn .22s ease;}
  @keyframes pinIn{from{opacity:0; transform:translateY(-4px)}to{opacity:1; transform:none}}
  .pinbar{display:flex; gap:7px; overflow-x:auto; scrollbar-width:none; padding:8px 12px;}
  .pinbar::-webkit-scrollbar{display:none;}
  .pin-pill{flex-shrink:0; display:inline-flex; align-items:center; gap:6px; font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:.02em; padding:5px 5px 5px 10px; border:1px solid color-mix(in srgb, var(--accent) 45%, var(--line-bright)); border-radius:7px; background:color-mix(in srgb, var(--accent) 11%, transparent); color:var(--accent); white-space:nowrap;}
  .pin-pill .cnt{font-weight:700; background:color-mix(in srgb, var(--accent) 24%, transparent); border-radius:8px; padding:0 6px; font-size:11px;}
  .pin-pill .star{font-size:11px;}
  .pin-pill .pin-x{cursor:pointer; opacity:.6; font-size:15px; line-height:1; padding:0 4px; color:var(--ink-dim);}
  .pin-pill .pin-x:active{opacity:1; color:var(--ink);}
  .pin-add{flex-shrink:0; display:inline-flex; align-items:center; cursor:pointer; font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:.04em; padding:5px 12px; border:1px dashed var(--line-bright); border-radius:7px; color:var(--ink-dim); background:transparent;}
  .pin-add:active{color:var(--accent); border-color:var(--accent);}

  /* add pop-up */
  .add-input{display:block; width:calc(100% - 36px); margin:2px 18px 0; padding:12px 14px; background:var(--bg-2); border:1px solid var(--line-bright); border-radius:9px; color:var(--ink); font-family:'IBM Plex Mono',monospace; font-size:15px; outline:none;}
  .add-input:focus{border-color:var(--accent);}
  .add-input::placeholder{color:var(--ink-dimmer);}
  .add-hint{padding:8px 18px 0; font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-dimmer);}
  .add-btn{display:block; width:calc(100% - 36px); margin:14px 18px 8px; padding:13px; text-align:center; border:none; border-radius:9px; background:var(--accent); color:#06120c; font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:13px; letter-spacing:.08em; cursor:pointer;}
  .add-btn:active{filter:brightness(.92);}

  .pin-pill.on{background:var(--accent); color:#06120c; border-color:var(--accent);}
  .pin-pill.on .pin-x{color:#06120c;} .pin-pill.on .cnt{background:rgba(0,0,0,.18);}

  /* settings sheet */
  .set-seg{display:flex; gap:6px; padding:2px 16px 10px;}
  .set-seg button{flex:1; padding:8px 0; font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.05em; border:1px solid var(--line-bright); border-radius:7px; background:var(--bg-1); color:var(--ink-dim); cursor:pointer;}
  .set-seg button.active{color:var(--accent); border-color:var(--accent); background:color-mix(in srgb,var(--accent) 10%, transparent);}
  .set-sub{padding:0 18px 8px; font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-dimmer); letter-spacing:.03em;}
  .set-row{display:flex; align-items:center; gap:10px; padding:10px 16px; border-bottom:1px solid var(--line);}
  .set-row.off{opacity:.42;}
  .set-num{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-dimmer); width:16px; text-align:center;}
  .set-label{font-family:'Archivo',sans-serif; font-size:15px; color:var(--ink); flex:1;}
  .set-mv{display:flex; gap:5px;}
  .set-mv button{width:30px; height:30px; border:1px solid var(--line-bright); border-radius:7px; background:var(--bg-2); color:var(--ink-dim); cursor:pointer; font-size:10px; display:flex; align-items:center; justify-content:center;}
  .set-mv button:active{color:var(--ink); border-color:var(--accent);}
  .set-mv button[disabled]{opacity:.28; pointer-events:none;}
  .set-toggle{width:42px; height:25px; border-radius:13px; background:var(--bg-3); border:1px solid var(--line-bright); position:relative; cursor:pointer; flex-shrink:0; transition:background .15s,border-color .15s;}
  .set-toggle b{position:absolute; top:2px; left:2px; width:19px; height:19px; border-radius:50%; background:var(--ink-dim); transition:left .15s,background .15s;}
  .set-toggle.on{background:color-mix(in srgb,var(--accent) 32%, transparent); border-color:var(--accent);}
  .set-toggle.on b{left:19px; background:var(--accent);}
  .set-toggle.lock{opacity:.4; pointer-events:none;}
  .set-add{margin:14px 16px 6px; padding:13px; text-align:center; border:1px dashed var(--line-bright); border-radius:9px; color:var(--ink-dimmer); font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:.05em; cursor:pointer;}
  .set-add:active{color:var(--ink-dim);}

  .hint{position:absolute; bottom:78px; left:50%; transform:translateX(-50%); z-index:48; font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--ink-dimmer); background:rgba(7,8,9,.85); border:1px solid var(--line); border-radius:20px; padding:6px 12px; pointer-events:none; opacity:0; transition:opacity .4s;}
  .hint.show{opacity:1;}

  /* ── FULL-SCREEN APP OVERRIDES (real device) ── */
  body{padding:0; display:block; background:#04050a;}
  .device{width:100vw; height:100vh; height:100dvh; max-height:none; padding:0; border-radius:0; box-shadow:none; background:transparent;}
  .screen{width:100%; height:100%; border-radius:0;}
  .notch,.statusbar{display:none !important;}
  header{padding-top:calc(10px + env(safe-area-inset-top));}
  nav{padding-bottom:calc(10px + env(safe-area-inset-bottom));}
  a.game{text-decoration:none; color:inherit;}

</style>

<body>
<div class="device">

<script type="module">

import {
  NewsData, state as D, LATEST, save,
  wxInfo, timeAgo, LOCATIONS, TOPIC_DEFS, LEAGUES,
  PIN_COUNTS, SPIN_COUNTS, dayOffsetYmd
} from './news-data/index.js';

const $ = id => document.getElementById(id);
const esc = s => { const d=document.createElement('div'); d.textContent = s==null?'':String(s); return d.innerHTML; };
const escAttr = s => esc(s).replace(/"/g,'&quot;');

/* ── weather icons ── */
const cloudHi = '<g fill="var(--ink-dim)"><circle cx="13" cy="14" r="5.5"/><circle cx="22" cy="14" r="6.5"/><circle cx="18" cy="10" r="5.5"/><rect x="10" y="14" width="16" height="5.5" rx="2.75"/></g>';
function wxIcon(type){
  const rays='<g stroke="var(--c-world)" stroke-width="2" stroke-linecap="round"><line x1="18" y1="2" x2="18" y2="7"/><line x1="18" y1="29" x2="18" y2="34"/><line x1="2" y1="18" x2="7" y2="18"/><line x1="29" y1="18" x2="34" y2="18"/><line x1="7" y1="7" x2="10.5" y2="10.5"/><line x1="25.5" y1="25.5" x2="29" y2="29"/><line x1="29" y1="7" x2="25.5" y2="10.5"/><line x1="10.5" y1="25.5" x2="7" y2="29"/></g>';
  switch(type){
    case 'sun': return `<svg viewBox="0 0 36 36">${rays}<circle cx="18" cy="18" r="6.5" fill="var(--c-world)"/></svg>`;
    case 'partly': return `<svg viewBox="0 0 36 36"><circle cx="13" cy="13" r="6" fill="var(--c-world)"/><g fill="var(--ink-dim)"><circle cx="15" cy="22" r="5.5"/><circle cx="23" cy="22" r="6.5"/><circle cx="19" cy="18" r="5.5"/><rect x="12" y="22" width="15" height="5.5" rx="2.75"/></g></svg>`;
    case 'cloud': return `<svg viewBox="0 0 36 36"><g fill="var(--ink-dim)"><circle cx="13" cy="19" r="6"/><circle cx="23" cy="19" r="7"/><circle cx="18" cy="14" r="6"/><rect x="9" y="19" width="18" height="6" rx="3"/></g></svg>`;
    case 'rain': return `<svg viewBox="0 0 36 36">${cloudHi}<g stroke="var(--c-local)" stroke-width="2" stroke-linecap="round"><line x1="13" y1="23" x2="13" y2="27"/><line x1="18" y1="23" x2="18" y2="27"/><line x1="23" y1="23" x2="23" y2="27"/></g></svg>`;
    case 'snow': return `<svg viewBox="0 0 36 36">${cloudHi}<g fill="var(--ink)"><circle cx="13" cy="24" r="1.7"/><circle cx="18" cy="24" r="1.7"/><circle cx="23" cy="24" r="1.7"/></g></svg>`;
    default: return `<svg viewBox="0 0 36 36">${cloudHi}</svg>`;
  }
}

/* ── accent + tag colour maps ── */
const ACCENT = {world:'--c-world',canada:'--c-canada',local:'--c-local',tech:'--c-tech',business:'--c-biz',ai:'--c-ai',pinned:'--c-pin',sports:'--c-sports',ringer:'--c-ringer',hbr:'--c-hbr',entertainment:'--c-ent',games:'--c-games',reviews:'--c-review',markets:'--c-markets',scores:'--c-sports'};
const tagColor = {world:'--c-world',canada:'--c-canada',local:'--c-local',tech:'--c-tech',biz:'--c-biz',ai:'--c-ai',pin:'--c-pin',sport:'--c-sports',sports:'--c-sports',ringer:'--c-ringer',ent:'--c-ent',games:'--c-games',review:'--c-review','biz-page':'--c-hbr'};

/* ── sections / tabs (keys match data-layer topic keys) ── */
const SECTIONS = {
  news:    {label:'News',    tabs:[['world','World'],['canada','Canada'],['local','Local'],['tech','Tech'],['business','Business'],['ai','AI'],['pinned','Pinned'],['sports','Sports']]},
  pages:   {label:'Pages',   tabs:[['ringer','The Ringer'],['hbr','HBR'],['entertainment','Variety'],['games','IGN'],['reviews','Movies']]},
  markets: {label:'Markets', tabs:[['overview','Overview'],['indexes','Indexes'],['stocks','Stocks'],['crypto','Crypto'],['tsx','TSX'],['rates','Rates']]},
  scores:  {label:'Scores',  tabs:[['all','All'],['NBA','NBA'],['NHL','NHL'],['MLB','MLB'],['NFL','NFL'],['EPL','EPL']]},
};
const NAV_ICONS = {
  news:'<path d="M4 5h16v14H4z"/><path d="M7 9h6M7 12h10M7 15h10"/>',
  pages:'<path d="M5 4h9l5 5v11H5z"/><path d="M14 4v5h5"/>',
  markets:'<path d="M4 19V8m5 11V5m5 14v-8m5 8V10"/>',
  scores:'<circle cx="12" cy="12" r="8"/><path d="M12 4v16M4 12h16M6.5 6.5l11 11M17.5 6.5l-11 11"/>',
};
const SECTION_COLOR = {news:'--c-world',pages:'--c-ent',markets:'--c-markets',scores:'--c-sports'};

/* ── UI state (separate from the data-layer store D) ── */
const ui = { section:'news', tab:{news:0,pages:0,markets:0,scores:0},
  pinFilter:{pinned:null,sports:null,stocks:null,tsx:null}, settingsSection:'news',
  tabOrder:{}, tabHidden:{}, scoreDay:0, read:new Set(), loaded:false };
const TAB_LABEL = {};
for(const sec in SECTIONS){ ui.tabOrder[sec]=SECTIONS[sec].tabs.map(t=>t[0]); ui.tabHidden[sec]=new Set(); SECTIONS[sec].tabs.forEach(([k,l])=>{TAB_LABEL[k]=l;}); }
function visTabs(sec){ return ui.tabOrder[sec].filter(k=>!ui.tabHidden[sec].has(k)).map(k=>[k,TAB_LABEL[k]]); }

const news = new NewsData();

/* ════ rendering ════ */
function setAccent(v){ document.documentElement.style.setProperty('--accent', `var(${v})`); }

function storyHTML(it, key){
  const def = TOPIC_DEFS[key] || {};
  const tag = it.tag || def.tag || 'world';
  const tc = `var(${tagColor[tag]||'--c-world'})`;
  const label = it.label || def.label || key;
  const pop = it.pop>=2 ? `<span class="pop pop${Math.min(it.pop,5)}">\u{1F525}${it.pop}</span>` : '';
  const fav = it.fav ? '<span class="star">\u2605</span> ' : '';
  const src = it.srcLabel ? `<span class="src-pill">${esc(it.srcLabel)}</span>` : '';
  let meter='';
  if(it.rt!=null) meter=`<span class="tomato ${it.rt>=60?'fresh':'rotten'}">${it.rt>=60?'\u{1F345}':'\u{1F7E2}'} ${it.rt}%</span>`;
  const meta = it.tmdb!=null ? `TMDB ${it.tmdb}` : (it.time?timeAgo(it.time):'');
  const title = def.strip ? String(it.title).replace(def.strip,'') : it.title;
  const readCls = ui.read.has(it.link)?' read':'';
  const reviewCls = it.isReview?' review-accent':'';
  return `<a class="story${reviewCls}${readCls}" href="${escAttr(it.link)}" target="_blank" rel="noopener" data-link="${escAttr(it.link)}">
    <div class="s-top"><span class="s-tag" style="background:color-mix(in srgb, ${tc} 16%, transparent);color:${tc}">${fav}${esc(label)}</span>${src}${meter}${pop}<span class="s-meta">${meta}</span></div>
    <div class="s-head">${esc(title)}</div></a>`;
}
function feedStories(items, key){
  if(items && items.length) return `<div class="pane-inner">${items.map(i=>storyHTML(i,key)).join('')}</div>`;
  return `<div class="pane-inner"><div class="empty">${ui.loaded?'No items':'Loading\u2026'}</div></div>`;
}

/* Sports tab = favourites (sportspin) + general sports news, deduped */
function newsItems(key){
  if(key==='sports'){
    const seen=new Set(), out=[];
    [...(LATEST.topics.sportspin||[]), ...(LATEST.topics.sports||[])].forEach(i=>{ if(i&&i.link&&!seen.has(i.link)){seen.add(i.link); out.push(i);} });
    return out;
  }
  return LATEST.topics[key]||[];
}

function mkRow(o){
  const chg=o.chg, cls=chg>=0?'up':'down', arr=chg>=0?'\u25B2':'\u25BC';
  const chgTxt = (chg==null||isNaN(chg))?'':`${arr}${Math.abs(chg).toFixed(2)}%`;
  const price = (o.price!=null&&!isNaN(o.price)) ? '$'+(o.price>=1?o.price.toLocaleString('en-CA',{minimumFractionDigits:2,maximumFractionDigits:2}):o.price.toFixed(4)) : '\u2014';
  return `<div class="mk-row"><div><div class="mk-sym">${esc(o.sym)}</div>${o.name?`<div class="mk-name">${esc(o.name)}</div>`:''}</div><div class="mk-price">${price}</div><div class="mk-chg ${cls}">${chgTxt}</div></div>`;
}
function marketsPane(key){
  const E=LATEST.equities||{indexes:[],stocks:[]};
  const groups={ indexes:['INDEXES',E.indexes||[]], stocks:['US STOCKS',E.stocks||[]], crypto:['CRYPTO',LATEST.crypto||[]], tsx:['TSX / CANADIAN',LATEST.caStocks||[]], rates:['CANADIAN RATES',LATEST.rates||[]] };
  const show = key==='overview' ? ['indexes','stocks','crypto','tsx','rates'] : [key];
  if(!ui.loaded) return `<div class="pane-inner"><div class="empty">Loading\u2026</div></div>`;
  let html='<div class="pane-inner">';
  show.forEach(k=>{
    const title=groups[k][0]; let data=groups[k][1];
    if(k==='rates'){
      html += `<div class="mk-group">${title}</div>` + (data.length ? data.map(r=>`<div class="mk-row"><div class="mk-sym">${esc(r.label)}</div><div class="mk-rate-v">${r.value!=null?r.value.toFixed(2):'\u2014'}%</div></div>`).join('') : '<div class="empty">\u2014</div>');
      return;
    }
    if((k==='stocks'||k==='tsx') && key===k && ui.pinFilter[k]) data=data.filter(o=>String(o.sym).replace(/\.TO$/,'').toUpperCase()===ui.pinFilter[k].toUpperCase());
    html += `<div class="mk-group">${title}</div>` + (data.length ? data.map(mkRow).join('') : '<div class="empty">No data</div>');
  });
  return html+'</div>';
}

function scoresPane(filter){
  const dayKey=dayOffsetYmd(ui.scoreDay);
  let games=(LATEST.games||[]).filter(g=>g.day===dayKey);
  if(filter!=='all') games=games.filter(g=>g.code===filter);
  const dateBar=`<div class="sc-datebar">${['Yesterday','Today','Tomorrow'].map((d,i)=>`<div class="sc-date ${ui.scoreDay===i-1?'active':''}" data-day="${i-1}">${d}</div>`).join('')}</div>`;
  if(!ui.loaded) return `<div class="pane-inner">${dateBar}<div class="empty">Loading\u2026</div></div>`;
  if(!games.length) return `<div class="pane-inner">${dateBar}<div class="empty">No games this day</div></div>`;
  const card=g=>{
    const hs=+g.home.score||0, as=+g.away.score||0, show=g.state==='in'||g.state==='post';
    const tag=g.link?'a':'div', attr=g.link?` href="${escAttr(g.link)}" target="_blank" rel="noopener"`:'';
    return `<${tag} class="game ${g.state==='in'?'live':''}"${attr}>
      <div class="g-row"><span class="g-abv">${esc(g.away.abv)}</span><span class="g-sc ${show&&as>hs?'win':''}">${show?esc(g.away.score):'\u2014'}</span></div>
      <div class="g-row"><span class="g-abv">${esc(g.home.abv)}</span><span class="g-sc ${show&&hs>as?'win':''}">${show?esc(g.home.score):'\u2014'}</span></div>
      <div class="g-status">${esc(g.code)} \u00B7 ${esc(g.status)}</div></${tag}>`;
  };
  const live=games.filter(g=>g.state==='in'), rest=games.filter(g=>g.state!=='in');
  let html=`<div class="pane-inner">${dateBar}`;
  if(live.length) html+=`<div class="sc-lg live">\u25CF LIVE</div>`+live.map(card).join('');
  if(rest.length) html+=`<div class="sc-lg">${filter==='all'?'GAMES':esc(filter)}</div>`+rest.map(card).join('');
  return html+'</div>';
}

function paneContent(section,tabKey){
  if(section==='news'||section==='pages'){
    let items = section==='news' ? newsItems(tabKey) : (LATEST.topics[tabKey]||[]);
    if(section==='news' && tabKey==='pinned' && ui.pinFilter.pinned) items=items.filter(i=>(i.label||'')===ui.pinFilter.pinned.toUpperCase());
    if(section==='news' && tabKey==='sports' && ui.pinFilter.sports) items=items.filter(i=>(i.label||'')===ui.pinFilter.sports.toUpperCase());
    return feedStories(items, tabKey);
  }
  if(section==='markets') return marketsPane(tabKey);
  if(section==='scores')  return scoresPane(tabKey);
  return '';
}

/* ════ strip + track ════ */
function buildStrip(){
  const tabs=visTabs(ui.section), idx=ui.tab[ui.section];
  $('strip').innerHTML = tabs.map((t,i)=>`<div class="tab ${i===idx?'active':''}" data-i="${i}">${t[1]}<span class="ul"></span></div>`).join('');
  const key=(tabs[idx]||[])[0];
  setAccent(ACCENT[key]||ACCENT[ui.section]||'--c-world');
}
function buildTrack(){
  const tabs=visTabs(ui.section);
  $('track').innerHTML = tabs.map(t=>`<div class="pane">${paneContent(ui.section,t[0])}</div>`).join('');
  positionTrack(false);
}
function positionTrack(animate){
  const idx=ui.tab[ui.section], track=$('track');
  track.style.transition = animate?'transform .26s cubic-bezier(.3,.9,.4,1)':'none';
  track.style.transform = `translateX(${-idx*100}%)`;
}
function renderActivePane(){
  const i=ui.tab[ui.section], panes=$('track').children, t=visTabs(ui.section)[i];
  if(panes[i] && t) panes[i].innerHTML = paneContent(ui.section, t[0]);
}
function selectTab(i,animate=true){
  const tabs=visTabs(ui.section);
  i=Math.max(0,Math.min(tabs.length-1,i));
  ui.tab[ui.section]=i;
  buildStrip(); renderPinBar(); renderActivePane(); positionTrack(animate);
  const el=$('strip').children[i]; if(el) el.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});
}
function switchSection(sec){
  ui.section=sec;
  const vt=visTabs(sec); if(ui.tab[sec]>=vt.length) ui.tab[sec]=Math.max(0,vt.length-1);
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active', b.dataset.sec===sec));
  buildStrip(); buildTrack(); renderPinBar();
  document.querySelector(`.nav-btn[data-sec="${sec}"]`).style.setProperty('--nav-accent',`var(${SECTION_COLOR[sec]})`);
}

/* ════ nav ════ */
$('nav').innerHTML = Object.entries(SECTIONS).map(([k,v])=>
  `<div class="nav-btn ${k==='news'?'active':''}" data-sec="${k}" style="--nav-accent:var(${SECTION_COLOR[k]})">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${NAV_ICONS[k]}</svg>
    <span class="lbl">${v.label.toUpperCase()}</span></div>`).join('');
$('nav').addEventListener('click',e=>{const b=e.target.closest('.nav-btn'); if(b) switchSection(b.dataset.sec);});
$('strip').addEventListener('click',e=>{const t=e.target.closest('.tab'); if(t) selectTab(+t.dataset.i);});

/* ════ story open (real links) + read mark + score dates ════ */
$('track').addEventListener('click',e=>{
  const sd=e.target.closest('.sc-date'); if(sd){ e.preventDefault(); ui.scoreDay=+sd.dataset.day; renderActivePane(); return; }
  const a=e.target.closest('a.story'); if(a){ const link=a.dataset.link; if(link){ ui.read.add(link); D.READ.add(link); save(); a.classList.add('read'); } }
});

/* ════ horizontal swipe between topics ════ */
(function(){
  const vp=$('viewport'), track=$('track');
  let startX=0,startY=0,dragging=false,decided=false,horiz=false,basePct=0,w=0;
  vp.addEventListener('pointerdown',e=>{
    if(e.target.closest('.sc-datebar')) return;
    dragging=true; decided=false; horiz=false;
    startX=e.clientX; startY=e.clientY; w=vp.clientWidth;
    basePct=-ui.tab[ui.section]*100; track.style.transition='none';
  });
  vp.addEventListener('pointermove',e=>{
    if(!dragging) return;
    const dx=e.clientX-startX, dy=e.clientY-startY;
    if(!decided){ if(Math.abs(dx)>8||Math.abs(dy)>8){ decided=true; horiz=Math.abs(dx)>Math.abs(dy); } else return; }
    if(!horiz) return; e.preventDefault();
    const n=visTabs(ui.section).length, idx=ui.tab[ui.section];
    let pct=basePct+(dx/w)*100;
    if(idx===0 && dx>0) pct=basePct+(dx/w)*40;
    if(idx===n-1 && dx<0) pct=basePct+(dx/w)*40;
    track.style.transform=`translateX(${pct}%)`;
  });
  function end(e){
    if(!dragging) return; dragging=false;
    if(!horiz) return;
    const dx=e.clientX-startX, idx=ui.tab[ui.section];
    if(dx<-50) selectTab(idx+1); else if(dx>50) selectTab(idx-1); else positionTrack(true);
  }
  vp.addEventListener('pointerup',end);
  vp.addEventListener('pointercancel',end);
  vp.addEventListener('pointerleave',e=>{if(dragging)end(e);});
})();

/* ════ pin bar ════ */
const PINCFG = {
  pinned:{count:true,star:false,title:'ADD PINNED TOPIC',word:'TOPIC',ph:'Topic or keyword \u2014 e.g. elections',hint:'Becomes a live news search across sources.',kind:'kw'},
  sports:{count:true,star:true,title:'ADD FAVOURITE',word:'FAVOURITE',ph:'Team, fighter or player',hint:'Followed across every sports feed.',kind:'kw'},
  stocks:{count:false,star:false,title:'ADD US TICKER',word:'TICKER',ph:'e.g. AMZN',hint:'Any US-listed symbol (Finnhub).',kind:'ticker'},
  tsx:{count:false,star:false,title:'ADD TSX TICKER',word:'TICKER',ph:'e.g. ENB',hint:'.TO is appended automatically.',kind:'ticker'},
};
function pinCtx(){
  const t=visTabs(ui.section)[ui.tab[ui.section]]; const key=t?t[0]:null;
  if(ui.section==='news'    && key==='pinned') return 'pinned';
  if(ui.section==='news'    && key==='sports') return 'sports';
  if(ui.section==='markets' && key==='stocks') return 'stocks';
  if(ui.section==='markets' && key==='tsx')    return 'tsx';
  return null;
}
function pinList(ctx){ return ctx==='pinned'?D.PINNED_TOPICS : ctx==='sports'?D.SPORTS_PINNED : ctx==='stocks'?D.STOCKS : ctx==='tsx'?D.CA_STOCKS : []; }
function pinCount(ctx,v){ if(ctx==='pinned') return PIN_COUNTS[v]||0; if(ctx==='sports') return SPIN_COUNTS[v]||0; return 0; }
function renderPinBar(){
  const ctx=pinCtx(), wrap=$('pinbarWrap');
  if(!ctx){ wrap.classList.remove('show'); return; }
  const cfg=PINCFG[ctx];
  const pills=pinList(ctx).map(v=>{
    const cnt = cfg.count ? `<span class="cnt">${pinCount(ctx,v)}</span>` : '';
    const star = cfg.star ? '<span class="star">\u2605</span>' : '';
    const label = cfg.kind==='ticker' ? v.toUpperCase()+(ctx==='tsx'?'.TO':'') : v;
    const on = ui.pinFilter[ctx]===v ? ' on' : '';
    return `<span class="pin-pill${on}" data-pin="${escAttr(v)}">${star}${esc(label)}${cnt}<span class="pin-x" data-rm="${escAttr(v)}">\u00D7</span></span>`;
  }).join('');
  wrap.querySelector('.pinbar').innerHTML = pills + `<span class="pin-add">+ ${cfg.word}</span>`;
  wrap.classList.add('show');
}
$('pinbarWrap').addEventListener('click',e=>{
  const rm=e.target.closest('.pin-x'); if(rm){ removePin(pinCtx(), rm.dataset.rm); return; }
  if(e.target.closest('.pin-add')){ openAddSheet(pinCtx()); return; }
  const pill=e.target.closest('.pin-pill'); if(pill){ toggleFilter(pinCtx(), pill.dataset.pin); }
});
function toggleFilter(ctx,val){ if(!ctx) return; ui.pinFilter[ctx] = ui.pinFilter[ctx]===val?null:val; renderActivePane(); renderPinBar(); }
function removePin(ctx,val){
  const list=pinList(ctx), i=list.findIndex(x=>x===val);
  if(i>=0) list.splice(i,1);
  if(ui.pinFilter[ctx]===val) ui.pinFilter[ctx]=null;
  renderPinBar(); renderActivePane(); scheduleRefresh();
}
let addCtx=null;
function openAddSheet(ctx){
  addCtx=ctx; const cfg=PINCFG[ctx];
  $('addTitle').textContent=cfg.title; $('pinInput').placeholder=cfg.ph; $('addHint').textContent=cfg.hint; $('pinInput').value='';
  openSheet('addSheet'); setTimeout(()=>$('pinInput').focus(),260);
}
function addPin(){
  if(!addCtx) return; const cfg=PINCFG[addCtx];
  let v=$('pinInput').value.trim(); if(!v){ closeSheets(); return; }
  if(cfg.kind==='ticker') v=v.toUpperCase().replace(/\.TO$/,'');
  const list=pinList(addCtx);
  if(!list.some(x=>x.toLowerCase()===v.toLowerCase())) list.push(v);
  closeSheets(); renderPinBar(); renderActivePane(); scheduleRefresh();
}
$('addBtn').addEventListener('click',addPin);
$('pinInput').addEventListener('keydown',e=>{ if(e.key==='Enter') addPin(); });

let refreshTimer=null;
function scheduleRefresh(){ clearTimeout(refreshTimer); refreshTimer=setTimeout(()=>news.refresh(),350); }

/* ════ settings: per-page reorder + remove ════ */
function openSettings(){ ui.settingsSection=ui.section; renderSettings(); openSheet('setSheet'); }
function renderSettings(){
  const sec=ui.settingsSection;
  $('setSheet').style.setProperty('--accent', `var(${SECTION_COLOR[sec]})`);
  $('setSeg').innerHTML = Object.keys(SECTIONS).map(s=>`<button class="${s===sec?'active':''}" data-sec="${s}">${SECTIONS[s].label}</button>`).join('');
  const order=ui.tabOrder[sec], hidden=ui.tabHidden[sec];
  const visCount=order.filter(k=>!hidden.has(k)).length;
  $('setList').innerHTML = order.map((k,i)=>{
    const off=hidden.has(k), lock=(!off&&visCount<=1)?' lock':'';
    return `<div class="set-row${off?' off':''}" data-key="${k}">
      <span class="set-num">${i+1}</span><span class="set-label">${TAB_LABEL[k]}</span>
      <span class="set-mv"><button data-mv="up" ${i===0?'disabled':''}>\u25B2</button><button data-mv="down" ${i===order.length-1?'disabled':''}>\u25BC</button></span>
      <span class="set-toggle ${off?'':'on'}${lock}" data-vis><b></b></span></div>`;
  }).join('');
}
$('setSeg').addEventListener('click',e=>{const b=e.target.closest('button'); if(b){ ui.settingsSection=b.dataset.sec; renderSettings(); }});
$('setList').addEventListener('click',e=>{
  const row=e.target.closest('.set-row'); if(!row) return;
  const sec=ui.settingsSection, key=row.dataset.key;
  const mv=e.target.closest('[data-mv]'); if(mv){ moveTab(sec,key,mv.dataset.mv); return; }
  if(e.target.closest('[data-vis]')) toggleHidden(sec,key);
});
$('setAdd').addEventListener('click',()=>flashHint('custom feeds \u2014 coming soon'));
function curKey(sec){ const t=visTabs(sec)[ui.tab[sec]]; return t?t[0]:null; }
function resync(sec, keepKey){
  const vis=visTabs(sec);
  let idx = keepKey!=null ? vis.findIndex(t=>t[0]===keepKey) : -1;
  if(idx<0) idx = Math.min(ui.tab[sec], vis.length-1);
  ui.tab[sec]=Math.max(0,idx);
  if(sec===ui.section){ buildStrip(); buildTrack(); renderPinBar(); }
}
function moveTab(sec,key,dir){
  const arr=ui.tabOrder[sec], i=arr.indexOf(key), j=dir==='up'?i-1:i+1;
  if(j<0||j>=arr.length) return;
  const keep=sec===ui.section?curKey(sec):null;
  [arr[i],arr[j]]=[arr[j],arr[i]];
  resync(sec,keep); renderSettings();
}
function toggleHidden(sec,key){
  const hidden=ui.tabHidden[sec], keep=sec===ui.section?curKey(sec):null;
  if(hidden.has(key)) hidden.delete(key);
  else { if(visTabs(sec).length<=1) return; hidden.add(key); }
  resync(sec, keep===key?null:keep); renderSettings();
}
$('gear').addEventListener('click',openSettings);

/* ════ overlays ════ */
const scrim=$('scrim');
function openSheet(id){ scrim.classList.add('open'); $(id).classList.add('open'); }
function closeSheets(){ scrim.classList.remove('open'); document.querySelectorAll('.sheet').forEach(s=>s.classList.remove('open')); }
scrim.addEventListener('click',closeSheets);
document.querySelectorAll('[data-close]').forEach(x=>x.addEventListener('click',closeSheets));

/* ════ weather ════ */
function renderWeatherMini(){
  const w=LATEST.weather; if(!w||!w.current) return;
  const c=w.current, info=wxInfo(c.weather_code);
  $('wxMiniIc').innerHTML=wxIcon(info.type);
  $('wxMiniT').textContent=Math.round(c.temperature_2m)+'\u00B0';
}
function renderWeatherSheet(){
  const w=LATEST.weather; if(!w||!w.current) return;
  const c=w.current, info=wxInfo(c.weather_code);
  $('wxBig').innerHTML=wxIcon(info.type);
  $('wxTemp').textContent=Math.round(c.temperature_2m)+'\u00B0';
  $('wxCond').textContent=info.label;
  $('wxFeels').textContent=`Feels ${Math.round(c.apparent_temperature)}\u00B0 \u00B7 Humidity ${c.relative_humidity_2m}% \u00B7 Wind ${Math.round(c.wind_speed_10m)} km/h`;
  $('wxSheetLoc').textContent=(news.location.city||'').toUpperCase();
  const hr=h=>{ const t=new Date(h.time), hh=t.getHours(), lbl=hh===0?'12a':hh<12?hh+'a':hh===12?'12p':(hh-12)+'p'; return `<div class="wx-hr"><span class="h">${lbl}</span><span class="ic">${wxIcon(wxInfo(h.code).type)}</span><span class="tp">${Math.round(h.temp)}\u00B0</span><span class="pp">${h.pop??0}%</span></div>`; };
  $('wxHourly').innerHTML=(w.hourly||[]).map(hr).join('');
  $('wxDaily').innerHTML=(w.daily||[]).map((d,i)=>{ const dn=i===0?'Today':new Date(d.date).toLocaleDateString([], {weekday:'short'}); return `<div class="wx-day"><span class="dn">${dn}</span><span class="di">${wxIcon(wxInfo(d.code).type)}</span><span class="dr"><span class="dmax">${Math.round(d.max)}\u00B0</span> <span class="dmin">${Math.round(d.min)}\u00B0</span></span></div>`; }).join('');
}
$('wxMini').addEventListener('click',()=>{ renderWeatherSheet(); openSheet('wxSheet'); });

/* ════ location ════ */
function buildLocList(){
  $('locList').innerHTML = LOCATIONS.map(l=>`<div class="loc-opt ${l.key===news.location.key?'sel':''}" data-key="${l.key}"><span class="lcode">${l.code}</span><span class="lcity">${esc(l.city)}</span><span class="lcheck">\u2713</span></div>`).join('');
}
$('locChip').addEventListener('click',()=>{ buildLocList(); openSheet('locSheet'); });
$('locList').addEventListener('click',e=>{
  const o=e.target.closest('.loc-opt'); if(!o) return;
  news.setLocationByKey(o.dataset.key);
  $('locCode').textContent=news.location.code;
  closeSheets(); news.refresh();
});
$('locDetect').addEventListener('click',()=>{
  const b=$('locDetect'); b.textContent='\u2316 Locating\u2026';
  if(!navigator.geolocation){ b.textContent='\u2316 Not available'; return; }
  navigator.geolocation.getCurrentPosition(p=>{
    news.setLocationByCoords(p.coords.latitude,p.coords.longitude);
    $('locCode').textContent=news.location.code;
    b.textContent='\u2316 Detect my location'; closeSheets(); news.refresh();
  }, ()=>{ b.textContent='\u2316 Permission denied'; setTimeout(()=>b.textContent='\u2316 Detect my location',2200); }, {timeout:8000});
});

/* ════ misc ════ */
function flashHint(txt){ const h=$('hint'); if(txt) h.textContent=txt; h.classList.add('show'); clearTimeout(h._t); h._t=setTimeout(()=>h.classList.remove('show'),2200); }
document.querySelector('.brand').addEventListener('click',()=>{ flashHint('refreshing\u2026'); news.refresh(); });

/* ════ live data events ════ */
news.on('refresh:start', ()=>document.body.classList.add('refreshing'));
news.on('update', ()=>{ ui.loaded=true; document.body.classList.remove('refreshing'); renderActivePane(); renderPinBar(); renderWeatherMini(); });
news.on('weather', ()=>{ renderWeatherMini(); if($('wxSheet').classList.contains('open')) renderWeatherSheet(); });
news.on('scores',  ()=>{ if(ui.section==='scores')  renderActivePane(); });
news.on('markets', ()=>{ if(ui.section==='markets') renderActivePane(); });
news.on('topics',  ()=>{ if(ui.section==='news'||ui.section==='pages') renderActivePane(); });

/* ════ boot ════ */
(async function boot(){
  try{ await news.init(); }catch(e){ console.error('init', e); }
  $('locCode').textContent = news.location.code;
  switchSection('news');
  news.start();                       // immediate fetch + polling; events fill the UI
  setTimeout(()=>flashHint('\u2190 swipe topics \u00B7 tap a pin to filter \u2192'),900);
})();

</script>
</body>
</html>
